name: One-time error audit patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'chore: apply reviewed error fixes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch review engines and validation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          def sub_once(text, pattern, repl, label):
              new,n=re.subn(pattern,repl,text,count=1,flags=re.S)
              if n!=1: raise SystemExit(f'patch failed: {label} ({n})')
              return new

          p=Path('app.js'); s=p.read_text(encoding='utf-8')
          s=sub_once(s,
            r"function sourceBase\(q\)\{.*?\}\nfunction usefulExplanation",
            "function legalBasis(q){const rows=(q?.legalBasis||[]).map(x=>typeof x==='string'?x:(x?.label||x?.title||'')).filter(Boolean);return rows.length?rows.slice(0,3).join(' • '):null;}\nfunction sourceBase(q){return legalBasis(q)||TOPIC_BASES[topicId(q)]||BASES[canon(q.subject)]||'Legislação específica do instituto cobrado.';}\nfunction usefulExplanation",
            'app legal basis')
          s=sub_once(s,
            r"function attemptsForQ\(id\)\{.*?\}\nfunction attemptsForConcept\(q\)\{.*?\}\nfunction recurrence",
            "function attemptsForQ(id){return state.attempts.filter(a=>a.qid===id);}\nfunction conceptKeyQ(q){const sid=canon(q?.subject),t=topicOf(q),raw=INTEL?.normalize?.(q?.topic||q?.ruleId||q?.id||'geral')||String(q?.topic||q?.ruleId||q?.id||'geral');return `${sid}|${t?.id||`raw:${raw}`}`;}\nfunction conceptKeyA(a){const sid=canon(a?.subject);let t=null;try{t=INTEL?.resolveTopic(sid,a?.topic)||null;}catch{}const raw=INTEL?.normalize?.(a?.topic||a?.ruleId||a?.qid||'geral')||String(a?.topic||a?.ruleId||a?.qid||'geral');return `${sid}|${t?.id||`raw:${raw}`}`;}\nfunction attemptsForConcept(q){const key=conceptKeyQ(q);return state.attempts.filter(a=>conceptKeyA(a)===key);}\nfunction recurrence",
            'app concept keys')
          s=sub_once(s,
            r"function updateReview\(q,correct\)\{.*?\}\nfunction answerQuestion",
            "function updateReview(q,correct){const old=state.reviews[q.id];if(!correct){const wrong=(old?.wrongCount||0)+1,lapses=(old?.lapses||0)+1;state.reviews[q.id]={...(old||{}),qid:q.id,subject:canon(q.subject),topic:topicLabel(q),due:now()+(wrong>=2?8*HOUR:DAY),interval:wrong>=2?1/3:1,streak:0,mastered:false,lastResult:false,lastSeen:now(),cause:null,wrongCount:wrong,lapses};return;}if(old){const intervals=[3,7,14,30,60],streak=(old.streak||0)+1,interval=intervals[Math.min(streak-1,intervals.length-1)];state.reviews[q.id]={...old,due:now()+interval*DAY,interval,streak,mastered:streak>=5,lastResult:true,lastSeen:now()};}}\nfunction answerQuestion",
            'app srs')
          s=sub_once(s,
            r"function addReinforcement\(\)\{.*?\}\nfunction feedbackHtml",
            "function addReinforcement(){if(!session)return;const q=session.qs[session.index],key=conceptKeyQ(q);let same=QUESTIONS.filter(x=>x.id!==q.id&&conceptKeyQ(x)===key&&!session.qs.some(y=>y.id===x.id));if(!same.length){notice('Não há outra questão desse conceito no banco atual. O conceito ficou registrado para revisão.');return;}if(INTEL)same=INTEL.selectAdaptiveQuestions(same.map(x=>({...x,topic:topicLabel(x)})),state,{limit:same.length,strategy:state.profile.strategy,subject:canon(q.subject)});session.qs.splice(session.index+1,0,same[0]);notice('Questão de reforço inserida logo a seguir.');renderQuestion();}\nfunction feedbackHtml",
            'app reinforcement')
          s=sub_once(s,
            r"function errorRows\(\)\{.*?\}\nfunction renderErrors",
            "function errorRows(){return Object.values(state.reviews).map(r=>{const q=qById(r.qid);if(!q)return null;const a=state.attempts.filter(x=>x.qid===r.qid),wrong=a.filter(x=>!x.correct).length,conceptWrong=attemptsForConcept(q).filter(x=>!x.correct).length;return {...r,q,wrong,total:a.length,conceptWrong,recurrent:wrong>=2||conceptWrong>=2||(r.lapses||0)>=2};}).filter(Boolean);}\nfunction renderErrors",
            'app error rows')
          s=sub_once(s,
            r"function startTopicBlock\(id\)\{.*?\}\nfunction renderConcepts",
            "function startTopicBlock(id){const q=qById(id);if(!q)return;const key=conceptKeyQ(q);let qs=QUESTIONS.filter(x=>conceptKeyQ(x)===key);qs=uniqueFamilies(qs).sort(()=>Math.random()-.5).slice(0,5);if(!qs.length){notice('Não há questões suficientes deste conceito.');return;}session={mode:'reinforcement',qs,index:0,answers:{},startedAt:now(),questionStartedAt:now()};$('sessionSetup').classList.add('hidden');$('sessionResult').classList.add('hidden');$('sessionArea').classList.remove('hidden');page('questions');startTimer();renderQuestion();}\nfunction renderConcepts",
            'app topic block')
          # Exibe reincidência conceitual no cartão do erro sem reescrever a tela inteira.
          s=s.replace("${x.wrong} erro(s)</span><span class=\"pill ${x.due<=now()?'warn':''}\">", "${x.wrong} erro(s) na questão</span><span class=\"pill ${x.conceptWrong>=2?'bad':''}\">${x.conceptWrong} erro(s) no conceito</span><span class=\"pill ${x.due<=now()?'warn':''}\">")
          s=s.replace('<b>Base:</b> ${sourceBase(x.q)}','<b>Base de revisão:</b> ${sourceBase(x.q)}')
          p.write_text(s,encoding='utf-8')

          p=Path('questao-guiada.js'); s=p.read_text(encoding='utf-8')
          s=sub_once(s,
            r"function attemptsQ\(q\)\{.*?\}\nfunction attemptsTopic\(q\)\{.*?\}\nfunction recurrence",
            "function attemptsQ(q){return state.attempts.filter(a=>a.qid===q.id);}\nfunction conceptKeyQ(q){const sid=canon(q?.subject),t=topic(q),raw=INTEL?.normalize?.(q?.topic||q?.ruleId||q?.id||'geral')||String(q?.topic||q?.ruleId||q?.id||'geral');return `${sid}|${t?.id||`raw:${raw}`}`;}\nfunction conceptKeyA(a){const sid=canon(a?.subject);let t=null;try{t=INTEL?.resolveTopic(sid,a?.topic)||null;}catch{}const raw=INTEL?.normalize?.(a?.topic||a?.ruleId||a?.qid||'geral')||String(a?.topic||a?.ruleId||a?.qid||'geral');return `${sid}|${t?.id||`raw:${raw}`}`;}\nfunction attemptsTopic(q){const key=conceptKeyQ(q);return state.attempts.filter(a=>conceptKeyA(a)===key);}\nfunction recurrence",
            'guided concept keys')
          s=sub_once(s,
            r"function updateReview\(q,correct\)\{.*?\}\nfunction answer",
            "function updateReview(q,correct){const old=state.reviews[q.id];if(!correct){const wrong=(old?.wrongCount||0)+1;state.reviews[q.id]={...(old||{}),qid:q.id,subject:canon(q.subject),topic:topicLabel(q),due:Date.now()+(wrong>=2?8*HOUR:DAY),interval:wrong>=2?1/3:1,streak:0,mastered:false,lastSeen:Date.now(),lastResult:false,cause:null,wrongCount:wrong,lapses:(old?.lapses||0)+1};return;}if(old){const ints=[3,7,14,30,60],streak=(old.streak||0)+1,interval=ints[Math.min(streak-1,ints.length-1)];state.reviews[q.id]={...old,due:Date.now()+interval*DAY,interval,streak,mastered:streak>=5,lastSeen:Date.now(),lastResult:true};}}\nfunction answer",
            'guided srs')
          s=sub_once(s,
            r"function sameConcept\(\)\{.*?\}\nfunction reinforce",
            "function sameConcept(){const key=conceptKeyQ(current);return QUESTIONS.filter(q=>q.id!==current.id&&conceptKeyQ(q)===key);}\nfunction reinforce",
            'guided reinforcement')
          # Usa fundamento específico da própria questão quando existir.
          s=s.replace("function useful(q){", "function legalBasis(q){const rows=(q?.legalBasis||[]).map(x=>typeof x==='string'?x:(x?.label||x?.title||'')).filter(Boolean);return rows.length?rows.slice(0,3).join(' • '):null;}\nfunction useful(q){")
          s=s.replace("${escapeHtml(BASES[canon(q.subject)]||'Legislação específica do instituto cobrado.')}", "${escapeHtml(legalBasis(q)||BASES[canon(q.subject)]||'Legislação específica do instituto cobrado.')}")
          p.write_text(s,encoding='utf-8')

          # O antigo interceptor não era carregado e só duplicava regra de revisão.
          Path('review-remediation.js').unlink(missing_ok=True)

          # Reforça o CI: sem embed privado, sem rotas locais quebradas e sem interceptor órfão.
          p=Path('.github/workflows/validate.yml'); s=p.read_text(encoding='utf-8')
          s=s.replace("if(/accessToken|drive\\.readonly|signInWithPopup|GoogleAuthProvider/.test(src)) throw new Error('Videoaulas não devem depender de OAuth/scanner no cliente');", "if(/accessToken|drive\\.readonly|signInWithPopup|GoogleAuthProvider|embeddedfolderview/.test(src)) throw new Error('Videoaulas não devem depender de OAuth/scanner/embed privado');")
          marker='      - name: Validate 1st phase distribution and 2nd phase rubrics\n'
          extra=r'''      - name: Validate local routes
        run: |
          python - <<'PY2'
          from pathlib import Path
          import re,sys
          root=Path('.')
          missing=[]
          for f in list(root.glob('*.html'))+list(root.glob('*.js')):
              text=f.read_text(encoding='utf-8')
              for target in re.findall(r'''(?:href|src)=["']([^"']+)["']''',text):
                  target=target.split('?',1)[0].split('#',1)[0]
                  if not target or target.startswith(('http:','https:','mailto:','tel:','data:','about:')): continue
                  if target.startswith('/'): continue
                  if not (root/target).exists(): missing.append(f'{f}: {target}')
          if Path('review-remediation.js').exists(): missing.append('review-remediation.js deveria ter sido removido')
          if missing:
              print('\n'.join(missing));sys.exit(1)
          print('Rotas locais íntegras.')
          PY2
'''
          if marker not in s: raise SystemExit('validate marker not found')
          s=s.replace(marker,extra+marker)
          p.write_text(s,encoding='utf-8')
          PY
          node --check app.js
          node --check questao-guiada.js
          node --check materiais.js
          git rm -f .github/workflows/one-time-error-audit.yml
      - name: Commit audited fixes
        run: |
          git config user.name 'drjfalcao-bot'
          git config user.email 'dr.jfalcao@gmail.com'
          git add -A
          git commit -m 'fix: harden error review and lesson access'
          git push
