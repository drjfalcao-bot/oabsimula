name: Apply error review patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'run: apply error review patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply deterministic patch
        run: node scripts/patch-error-review.mjs
      - name: Validate patched JavaScript
        run: |
          node --check app.js
          node --check questao-guiada.js
          node --check materiais.js
      - name: Commit patch
        run: |
          rm -f scripts/patch-error-review.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: harden error review and lesson access'
          git push
