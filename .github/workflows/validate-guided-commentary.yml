name: Validate Guided Commentary

on:
  push:
    branches: [main]
    paths:
      - 'guided-commentary-guard.js'
      - 'professor-bridge.js'
      - 'functions/professor-api.js'
      - 'functions/main.js'
      - '.github/workflows/validate-guided-commentary.yml'
  pull_request:
    branches: [main]
    paths:
      - 'guided-commentary-guard.js'
      - 'professor-bridge.js'
      - 'functions/professor-api.js'
      - 'functions/main.js'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check guided-commentary-guard.js
          node --check professor-bridge.js
          node --check functions/professor-api.js
          node --check functions/main.js
      - name: Assert substantive guided fallback
        shell: bash
        run: |
          set -euo pipefail
          grep -q "erro de proibição" guided-commentary-guard.js
          grep -q "mero desconhecimento da lei" guided-commentary-guard.js
          grep -q "não elimina a tipicidade" guided-commentary-guard.js
          grep -q "culpabilidade" guided-commentary-guard.js
