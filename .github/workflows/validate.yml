name: Validate OAB APROVA

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data.js
          node --check learning-materials.js
          node --check oab-intelligence.js
          node --check cronograma.js
          node --check fabrica.js
          node --check caderno.js
          node --check materiais.js
          node --check trilha.js
          node --check question-bank.js
          node --check fgv-bank.js
          node --check expanded-bank.js
          node --check official-fgv-bank.js
          node --check questao-guiada.js
          node --check second-phase-data.js
          node --check segunda-fase.js
          node --check functions/index.js
          node --check functions/main.js
          node --check functions/question-engine.js
          node --check functions/oab-blueprint.js
          node --check functions/coverage-engine.js
          node --check scripts/validate-oab-intelligence.mjs
      - name: Validate OAB intelligence matrix
        run: node scripts/validate-oab-intelligence.mjs
      - name: Validate live Drive lesson catalogue
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync('materiais.js','utf8');
          const ids=[...src.matchAll(/folder:'([A-Za-z0-9_-]{15,})'/g)].map(x=>x[1]);
          if(ids.length<20) throw new Error(`Catálogo de videoaulas incompleto: ${ids.length} pastas`);
          if(new Set(ids).size!==ids.length) throw new Error('Catálogo de videoaulas contém pastas duplicadas');
          if(/accessToken|drive\.readonly|signInWithPopup|GoogleAuthProvider/.test(src)) throw new Error('Videoaulas não devem depender de OAuth/scanner no cliente');
          console.log(`Catálogo ao vivo: ${ids.length} pastas de videoaulas.`);
          NODE
      - name: Validate calibrated editorial seed
        run: |
          node - <<'NODE'
          const fs=require('fs'),zlib=require('zlib');
          const source=fs.readFileSync('fgv-bank.js','utf8');
          const match=source.match(/const DATA = '([^']+)'/);
          if(!match) throw new Error('Payload do banco calibrado ausente');
          const questions=JSON.parse(zlib.gunzipSync(Buffer.from(match[1],'base64')).toString('utf8'));
          if(questions.length<33) throw new Error(`Banco editorial regrediu: ${questions.length}`);
          const ids=new Set();
          for(const q of questions){
            if(!q.id||ids.has(q.id)) throw new Error(`ID inválido/duplicado: ${q.id}`); ids.add(q.id);
            if(!Array.isArray(q.options)||q.options.length!==4) throw new Error(`${q.id}: alternativas inválidas`);
            if(!Number.isInteger(q.correct)||q.correct<0||q.correct>3) throw new Error(`${q.id}: gabarito inválido`);
            if(String(q.text||'').length<150) throw new Error(`${q.id}: enunciado curto`);
            if(String(q.explanation||'').length<100) throw new Error(`${q.id}: explicação insuficiente`);
          }
          console.log(`Seed editorial íntegro: ${questions.length} questões.`);
          NODE
      - name: Validate expanded grounded bank
        run: |
          node --input-type=module - <<'NODE'
          const mod=await import('./expanded-bank.js');
          const questions=mod.getExpandedQuestions();
          if(mod.EXPANDED_RULE_COUNT!==110) throw new Error(`Esperadas 110 regras, recebidas ${mod.EXPANDED_RULE_COUNT}`);
          if(questions.length!==550) throw new Error(`Esperadas 550 questões, recebidas ${questions.length}`);
          const ids=new Set(),rules=new Map();
          for(const q of questions){
            if(!q.id||ids.has(q.id)) throw new Error(`ID inválido/duplicado: ${q.id}`);ids.add(q.id);
            if(!q.ruleId) throw new Error(`${q.id}: ruleId ausente`);
            rules.set(q.ruleId,(rules.get(q.ruleId)||0)+1);
            if(!Array.isArray(q.options)||q.options.length!==4||new Set(q.options).size!==4) throw new Error(`${q.id}: alternativas inválidas`);
            if(!q.sources?.[0]?.url?.startsWith('https://')) throw new Error(`${q.id}: fonte ausente`);
            if(!q.legalBasis?.[0]?.label) throw new Error(`${q.id}: fundamento ausente`);
          }
          for(const [rule,count] of rules) if(count!==5) throw new Error(`${rule}: ${count} variantes`);
          console.log(`Banco expandido íntegro: ${questions.length} questões / ${rules.size} regras.`);
          NODE
      - name: Validate official FGV exam catalogue
        run: |
          node --input-type=module - <<'NODE'
          const mod=await import('./official-fgv-bank.js');
          const issues=mod.validateOfficialFgvConfig();
          if(issues.length) throw new Error(issues.join('; '));
          if(mod.OFFICIAL_FGV_EXAM_COUNT!==5) throw new Error('Quantidade de exames oficiais divergente');
          if(mod.OFFICIAL_FGV_QUESTION_TOTAL!==400) throw new Error('Histórico FGV divergente');
          if(mod.OFFICIAL_FGV_ACTIVE_TARGET!==397) throw new Error('Total válido FGV divergente');
          console.log('Catálogo FGV íntegro.');
          NODE
      - name: Validate HTML IDs and removed AI routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys
          pages=['index.html','questao-guiada.html','bank.html','segunda-fase.html','fabrica.html','trilha.html','cronograma.html','caderno.html','materiais.html']
          failed=False
          for name in pages:
              text=Path(name).read_text(encoding='utf-8')
              ids=re.findall(r'\bid=["\']([^"\']+)["\']',text)
              dup=sorted({x for x in ids if ids.count(x)>1})
              if dup:
                  print(name,'IDs duplicados:',dup); failed=True
              if 'ia.html' in text or 'Professor IA' in text:
                  print(name,'ainda referencia Professor IA'); failed=True
          for removed in ['ia.html','ia.js','professor-bridge.js','functions/professor-api.js']:
              if Path(removed).exists():
                  print(removed,'deveria ter sido removido'); failed=True
          if failed: sys.exit(1)
          PY
      - name: Validate 1st phase distribution and 2nd phase rubrics
        run: |
          node - <<'NODE'
          global.window={}; require('./data.js');
          const total=window.OAB_SUBJECTS.reduce((a,s)=>a+s.q,0);
          const core=window.OAB_SUBJECTS.filter(s=>s.core).reduce((a,s)=>a+s.q,0);
          if(total!==80) throw new Error(`Distribuição inválida: ${total}`);
          if(core!==62) throw new Error(`Núcleo inválido: ${core}`);
          global.window={}; require('./second-phase-data.js');
          for(const c of window.OAB_SECOND_PHASE.seedCases){
            const sum=c.rubric.reduce((a,x)=>a+Number(x[1]||0),0);
            if(Math.abs(sum-5)>0.001) throw new Error(`${c.id}: espelho soma ${sum}`);
          }
          console.log('Distribuição 80/62 e espelhos 5,00 válidos.');
          NODE