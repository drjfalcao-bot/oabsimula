<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OAB APROVA | Fábrica de Questões</title><link rel="stylesheet" href="styles.css"><style>body{background:#eef2f5}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.box{background:#fff;border:1px solid #e1d8c7;border-radius:20px;padding:18px}.out{white-space:pre-wrap;max-height:440px;overflow:auto;background:#0e1b2a;color:#e8f2fb;border-radius:14px;padding:14px;font:13px/1.5 monospace}.row{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#6b7280}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="row" style="justify-content:space-between;align-items:center"><div><div class="eyebrow">OAB APROVA PREMIUM</div><h1>Fábrica de Questões IA</h1></div><div class="row"><a class="btn secondary" href="index.html">1ª Fase</a><a class="btn secondary" href="segunda-fase.html">2ª Fase</a><a class="btn secondary" href="bank.html">Banco</a></div></div><p class="muted">Gere lotes autorais no padrão FGV, valide e incorpore ao IndexedDB. O sistema nunca precisa ter um teto fixo de questões.</p><div class="grid"><section class="box"><h2>Gerar lote</h2><label>Matéria<select id="subject"></select></label><label>Tema<input id="topic" placeholder="Ex.: Controle de constitucionalidade"></label><label>Dificuldade<select id="difficulty"><option value="3">Média</option><option value="4">Difícil</option><option value="5">FGV pesada</option></select></label><label>Quantidade<select id="qty"><option>5</option><option selected>10</option><option>15</option><option>20</option></select></label><button class="btn primary" id="generate">Gerar questões</button><p class="muted small" id="status">Login Google necessário para gerar.</p></section><section class="box"><h2>Qualidade do lote</h2><div id="quality" class="muted">Nenhum lote gerado.</div><div class="row"
